services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data 


  redis:
        image: redis:7-alpine
        container_name: my-redis
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        command: ["redis-server", "--requirepass", "your_password_here", "--appendonly", "yes"]
        restart: unless-stopped
        
volumes: 
  pgdata:
  redis_data:
    driver: local
 
